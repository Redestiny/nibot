name: "Release Desktop"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run build -w electron
      # No signing certificates: mac builds are ad-hoc signed, win builds
      # unsigned. The release job attaches all artifacts in one place, so
      # the two platform jobs never race to create the GitHub release.
      - name: Package (mac)
        if: runner.os == 'macOS'
        run: npm run dist:mac -w electron -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package (win)
        if: runner.os == 'Windows'
        run: npm run dist:win -w electron -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            electron/release/*.dmg
            electron/release/*.exe
            electron/release/*.blockmap
            electron/release/latest*.yml

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          Nibot 桌面写作台（内置与 `nibot gui` 相同的界面，无需安装 Node.js）。

          | 平台 | 下载 |
          |------|------|
          | macOS（Apple Silicon） | `Nibot-*-mac-arm64.dmg` |
          | macOS（Intel） | `Nibot-*-mac-x64.dmg` |
          | Windows（x64） | `Nibot-Setup-*.exe` |

          **macOS 首次打开**：安装包未经 Apple 公证，若提示"已损坏/无法打开"，请执行 `xattr -cr /Applications/Nibot.app` 后重新打开。
          **Windows 首次打开**：安装包未签名，SmartScreen 提示时点击"更多信息 → 仍要运行"。

          书籍默认保存在 `文档/Nibot`（菜单"文件 → 选择书籍目录"可更换），provider 配置与 CLI 共享 `~/.config/nibot`。
          EOF
          ls -la assets/
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
