# Everything the app needs is staged into build/ by scripts/build.mjs
# (bundled main.js + web assets), so node_modules is excluded entirely.
appId: com.redestiny.nibot
productName: Nibot
directories:
  output: release
  buildResources: resources
files:
  - build/**
  - package.json
  - "!node_modules"
asar: true
npmRebuild: false

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  extendInfo:
    # Books default to ~/Documents/Nibot; first launch triggers the macOS
    # Documents-folder privacy prompt and this string explains why.
    NSDocumentsFolderUsageDescription: Nibot 将书籍保存在"文稿/Nibot"目录中。

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

publish:
  provider: github
  owner: Redestiny
  repo: nibot
  releaseType: draft
